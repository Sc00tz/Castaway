name: Docker image

# Builds the Castaway server image for x86_64 and ARM64 and publishes it to GitHub Container
# Registry as ghcr.io/sc00tz/castaway. No registry account or secret is needed: the workflow's
# own GITHUB_TOKEN can push packages for this repository.
#
#   push to main  ->  :latest, :main, :sha-<short sha>
#   tag vX.Y.Z    ->  :X.Y.Z, :latest
#   manual run    ->  :manual-<short sha>
#   pull request  ->  built (x86_64) and real-flow tested only; nothing is published

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Phone changes run too: the real-flow test below exercises the phone's code.
    paths-ignore:
      - "**.md"
      - "images/**"
      - "deployment/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "images/**"
      - "deployment/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  # On main, let every build finish (a cancelled run counts as a failure in GitHub's emails);
  # newer pushes queue behind it instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Registry paths must be lowercase.
  IMAGE: ghcr.io/sc00tz/castaway

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tags: ${{ steps.v.outputs.tags }}
    steps:
      - id: v
        run: |
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$version latest"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="main-$short"
            tags="latest main sha-$short"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="pr-$short"
            tags=""
          else
            version="manual-$short"
            tags="manual-$short"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }}
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg "CASTAWAY_VERSION=${{ needs.version.outputs.version }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --cache-from "type=gha,scope=${{ matrix.arch }}" \
            --cache-to "type=gha,scope=${{ matrix.arch }},mode=max" \
            --tag "$IMAGE:build-${{ github.run_id }}-${{ matrix.arch }}" \
            --push \
            -f dockerfile .
      # A pull request builds x86_64 only, for the real-flow test, and publishes nothing.
      - name: Build for testing (pull request)
        if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "CASTAWAY_VERSION=${{ needs.version.outputs.version }}" \
            --cache-from "type=gha,scope=amd64" \
            --tag castaway:pull-request \
            --output "type=docker,dest=${{ runner.temp }}/castaway-image.tar" \
            -f dockerfile .
      - name: Keep the image for the real-flow test (pull request)
        if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: castaway-image
          path: ${{ runner.temp }}/castaway-image.tar
          retention-days: 1

  # The real server image, recorded real Apple answers, the phone's own code and the web app in a
  # real browser, end to end (tests/real-flow/run.sh). The image is only published if it passes.
  real-flow:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - name: The image built for this pull request
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: castaway-image
          path: ${{ runner.temp }}
      - name: Load it (pull request)
        if: github.event_name == 'pull_request'
        run: docker load --input "${{ runner.temp }}/castaway-image.tar"
      - name: Phone and browser dependencies
        run: |
          (cd mobile && flutter pub get)
          (cd tests/real-flow && npm ci --no-fund --no-audit && npx playwright install --with-deps chromium)
      - name: Real flow against this image
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && 'castaway:pull-request' || format('{0}:build-{1}-amd64', env.IMAGE, github.run_id) }}
        run: tests/real-flow/run.sh
      - name: Screenshots of a failed browser step
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-flow-screenshots
          path: tests/real-flow/real-flow-*.png
          if-no-files-found: ignore

  publish:
    needs: [version, build, real-flow]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the architectures under the release tags
        run: |
          args=()
          for tag in ${{ needs.version.outputs.tags }}; do args+=(--tag "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:build-${{ github.run_id }}-amd64" \
            "$IMAGE:build-${{ github.run_id }}-arm64"
          echo "Published: ${{ needs.version.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
