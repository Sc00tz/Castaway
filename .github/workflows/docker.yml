name: Docker image

# Builds the Castaway server image for x86_64 and ARM64 and publishes it to GitHub Container
# Registry as ghcr.io/sc00tz/castaway. No registry account or secret is needed: the workflow's
# own GITHUB_TOKEN can push packages for this repository.
#
#   push to main  ->  :latest, :main, :sha-<short sha>
#   tag vX.Y.Z    ->  :X.Y.Z, :latest
#   manual run    ->  :manual-<short sha>

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "mobile/**"
      - "**.md"
      - "images/**"
      - "deployment/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Registry paths must be lowercase.
  IMAGE: ghcr.io/sc00tz/castaway

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tags: ${{ steps.v.outputs.tags }}
    steps:
      - id: v
        run: |
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags="$version latest"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="main-$short"
            tags="latest main sha-$short"
          else
            version="manual-$short"
            tags="manual-$short"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg "PINEPODS_VERSION=${{ needs.version.outputs.version }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --cache-from "type=gha,scope=${{ matrix.arch }}" \
            --cache-to "type=gha,scope=${{ matrix.arch }},mode=max" \
            --tag "$IMAGE:build-${{ github.run_id }}-${{ matrix.arch }}" \
            --push \
            -f dockerfile .

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the architectures under the release tags
        run: |
          args=()
          for tag in ${{ needs.version.outputs.tags }}; do args+=(--tag "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:build-${{ github.run_id }}-amd64" \
            "$IMAGE:build-${{ github.run_id }}-arm64"
          echo "Published: ${{ needs.version.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
