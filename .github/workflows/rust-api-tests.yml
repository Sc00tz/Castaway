name: rust-api tests

permissions:
  contents: read

# Unit tests plus the integration suite (rust-api/tests/integration): the real router against
# a real PostgreSQL database, built by the server's own migrations (rust-api/migrations), and
# Valkey.
on:
  push:
    branches:
      - main
    paths:
      - 'rust-api/**'
      - 'mobile/lib/services/pinepods/**'
      - 'mobile/lib/entities/**'
      - 'mobile/test/contract/**'
      - '.github/workflows/rust-api-tests.yml'
  pull_request:
    paths:
      - 'rust-api/**'
      - 'mobile/lib/services/pinepods/**'
      - 'mobile/lib/entities/**'
      - 'mobile/test/contract/**'
      - '.github/workflows/rust-api-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: postgresql
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pinepods
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U pinepods"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-api

      - name: Install the dump tools and ffmpeg
        run: |
          # Backup tests run the real dump tools, which must match the server's major version.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -qy postgresql-client-18 ffmpeg

      - name: Unit tests
        working-directory: rust-api
        run: cargo test --lib --bins

      - name: Integration tests
        working-directory: rust-api
        env:
          PINEPODS_TEST_EXTERNAL_SERVICES: "1"
        run: scripts/integration-tests.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true

      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: The mobile app's API client against this server
        working-directory: rust-api
        env:
          PINEPODS_TEST_EXTERNAL_SERVICES: "1"
        run: scripts/integration-tests.sh -- -- --ignored mobile_contract
