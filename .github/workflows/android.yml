name: Android app

# Builds the Castaway Android APK (app id com.sc00tz.castaway).
#
#   push to main (mobile changes) or manual run  ->  APK as a workflow artifact
#   tag vX.Y.Z                                    ->  also attached to the GitHub release
#
# Signing: add these repository secrets to sign with your release key, so installed builds
# can be updated by newer ones:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks keystore file
#   ANDROID_STORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Without them the APK is signed with a throwaway debug key: fine for trying a build, but it
# can't update an installed release build, and one debug build can't update another.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # On main, let every build finish (a cancelled run counts as a failure in GitHub's emails);
  # newer pushes queue behind it instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the APK to a release on version tags
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        working-directory: mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          {
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "storeFile=../upload-keystore.jks"
          } > key.properties

      - name: No release key configured
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key and can't update a release-signed install."

      - run: flutter pub get

      - run: flutter test

      # A release APK carries the release's version and a build number that always goes up, so it
      # installs over the previous one.
      - name: Build APK
        run: |
          args=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args="--build-name=${GITHUB_REF_NAME#v} --build-number=$(( $(date +%s) / 60 ))"
          fi
          flutter build apk --release $args

      - name: Name the APK
        id: apk
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="main-${GITHUB_SHA::7}"; fi
          name="castaway-${version}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: mobile/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "Castaway $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --clobber
