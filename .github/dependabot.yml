# Weekly dependency update pull requests.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/rust-api"
    schedule:
      interval: "weekly"
    ignore:
      # feed-rs 3.0.x changes which audio address episodes get and fails on some real feeds
      # (see the comment on feed-rs in rust-api/Cargo.toml). A later 3.x is still proposed.
      - dependency-name: "feed-rs"
        versions: ["3.0.x"]
