# Weekly dependency update pull requests.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # faster-whisper 1.2.1 calls av.open(..., metadata_errors=...), which PyAV 19 removed, so
      # every AI transcription would fail. Hold PyAV at 18.x until faster-whisper supports 19
      # (see pinepods-ai/requirements.txt).
      - dependency-name: "av"
        versions: [">=19"]
