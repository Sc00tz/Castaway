# Throwaway PostgreSQL and Valkey for the rust-api integration suite (tests/integration).
# Started by scripts/integration-tests.sh; ports are deliberately off the defaults so they
# never collide with a real Castaway (or anything else) running on the dev machine.
# Data lives on tmpfs: every `up` starts clean, and nothing here is worth keeping.
name: castaway-api-tests

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: castaway
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=500"]
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castaway"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
