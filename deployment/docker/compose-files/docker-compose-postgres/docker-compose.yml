# Production setup: Castaway with its own database server and Valkey. For the easiest
# single-container install, see docker-compose-sqlite.
services:
  db:
    container_name: db
    image: postgres:18
    environment:
      POSTGRES_DB: pinepods_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: myS3curepass
      PGDATA: /var/lib/pgdata/pgdata
    volumes:
      - /home/user/castaway/pgdata:/var/lib/pgdata
    restart: always

  valkey:
    image: valkey/valkey:8-alpine
    restart: always

  castaway:
    image: ghcr.io/sc00tz/castaway:latest  # built by GitHub Actions on every push to main
    ports:
      - "8040:8040"
    environment:
      # Basic Server Info
      SEARCH_API_URL: "https://search.pinepods.online/api/search"
      PEOPLE_API_URL: "https://people.pinepods.online"
      HOSTNAME: "http://localhost:8040"
      # Database Vars
      DB_TYPE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: myS3curepass
      DB_NAME: pinepods_database
      # Valkey Settings
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      # Enable or Disable Debug Mode for additional Printing
      DEBUG_MODE: false
      PUID: ${UID:-911}
      PGID: ${GID:-911}
      # Add timezone configuration
      TZ: "America/New_York"
      # Language Configuration
      DEFAULT_LANGUAGE: "en"
      # Feeds and downloads hosted on your own network (a NAS, Audiobookshelf, a Tailscale
      # peer) are blocked by default, so a feed can't make the server probe your LAN. List the
      # hosts or networks to allow, comma-separated IPs or CIDRs:
      # ALLOWED_PRIVATE_NETWORKS: "192.168.1.20,100.64.0.0/10"
      # Single sign-on: by default, a first SSO login only creates an account when the provider
      # restricts who can log in (OIDC_ROLES_CLAIM + OIDC_USER_ROLE). Set to true to let anyone
      # who can sign in at your provider get an account, or false to never create accounts.
      # OIDC_AUTO_CREATE_USERS: "false"
      # SSO logins only link to an existing account by email when the provider marks the email
      # verified. Only for a provider you control that never sends email_verified:
      # OIDC_TRUST_UNVERIFIED_EMAIL: "true"
      # Optional AI features (#726 transcripts, #790 ad detection). Uncomment + run the
      # castaway-ai service below to enable; leave unset to keep AI features disabled.
      # PINEPODS_AI_URL: "http://castaway-ai:8100"
    volumes:
      # Mount the download and backup locations on the server
      - /home/user/castaway/downloads:/opt/pinepods/downloads
      - /home/user/castaway/backups:/opt/pinepods/backups
      # Mount local media files to use the Add Local Podcast feature (optional)
      - /home/user/castaway/local-media:/opt/pinepods/local-media
      # Timezone volumes, HIGHLY optional. Read the timezone notes below
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: always
    depends_on:
      - db
      - valkey

  # Optional AI sidecar for transcription (#726) + ad detection (#790). Disabled by
  # default — uncomment this whole service AND the PINEPODS_AI_URL var above to enable.
  # Model choices are managed at runtime from Settings → AI in the web UI; the env vars
  # below are only initial defaults. It only needs read-only access to the downloads dir.
  # castaway-ai:
  #   image: castaway-ai:latest  # build it: docker build -t castaway-ai ./pinepods-ai
  #   environment:
  #     WHISPER_MODEL: "base"        # tiny|base|small|medium|large-v3
  #     WHISPER_DEVICE: "cpu"        # cuda if using a GPU image
  #     WHISPER_COMPUTE_TYPE: "int8"
  #     # Ad detection (#790): use a bundled local GGUF, or point AI_LLM_URL at an
  #     # OpenAI-compatible endpoint (Ollama/LM Studio/cloud). Best set from the UI.
  #     AI_LLM_MODEL: ""             # local GGUF filename under /models (optional default)
  #     # AI_LLM_URL: "http://ollama:11434/v1"
  #     # AI_LLM_API_KEY: ""
  #     # AI_LLM_MODEL_NAME: "qwen2.5:3b"
  #   volumes:
  #     - /home/user/castaway/downloads:/opt/pinepods/downloads:ro
  #     - castaway-ai-models:/models
  #   restart: always

